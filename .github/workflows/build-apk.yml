name: Build APK

on:
  push:
    branches: [main, sleep-tracker]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Dark theme and edge-to-edge colours
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">#0E0B1A</item>\n        <item name="android:statusBarColor">#0E0B1A</item>\n        <item name="android:navigationBarColor">#0E0B1A</item>|' "$STYLES" || true

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nidra-sleep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nidra-sleep-apk
          path: nidra-sleep.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sleep-v${{ github.run_number }}
          name: Nidra Sleep v${{ github.run_number }}
          files: nidra-sleep.apk
