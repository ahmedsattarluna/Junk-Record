name: Build APK

on:
  push:
    branches: [sleep-tracker]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply icon, theme colours and signing key
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          mkdir -p ~/.android
          cp resources/sleep.keystore ~/.android/debug.keystore

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sleep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sleep-apk
          path: sleep.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sleep-v${{ github.run_number }}
          name: Sleep v${{ github.run_number }}
          files: sleep.apk
