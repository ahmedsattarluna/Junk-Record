@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

.jl.dark{
  --bg:#141518; --surface:#1D1F24; --raise:#26282F;
  --ink:#EDEEF0; --ink2:#AFB2B9; --muted:#787C85;
  --line:rgba(237,238,240,.12); --accent:#E9B949; --soft:#2A2820; --red:#E58C84;
  --onAccent:#1A1810; --ok:#7FC79B;
}
.jl.light{
  --bg:#F7F6F2; --surface:#FFFFFF; --raise:#FFFFFF;
  --ink:#1A1B1E; --ink2:#4E5157; --muted:#8B8E96;
  --line:rgba(26,27,30,.12); --accent:#B8841A; --soft:#F6EEDC; --red:#B2483F;
  --onAccent:#FFFFFF; --ok:#3C7F58;
}

.jl{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  min-height:100vh;padding:0 0 40px;-webkit-font-smoothing:antialiased;}
.jl *{box-sizing:border-box;}
.jl button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
.jl :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.jl .dim{color:var(--muted);}
.jl .pad{padding:24px 20px;}
.jl input[type=date],.jl input[type=time]{color-scheme:light;}
.jl.dark input[type=date],.jl.dark input[type=time]{color-scheme:dark;}

.jl .top{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;}
.jl h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0;}
.jl .acts{display:flex;gap:2px;}
.jl .icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);}
.jl .icon:hover{background:var(--surface);}
.jl .icon:disabled{opacity:.3;cursor:default;}

.jl .tabs{display:flex;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);}
.jl .tab{display:flex;align-items:center;gap:6px;padding:10px 0 11px;font-size:14px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;}
.jl .tab.on{color:var(--ink);border-bottom-color:var(--accent);}

.jl .main{padding:0 18px;max-width:560px;margin:0 auto;}

.jl .addBox{padding:18px 0 6px;}
.jl .addRow{display:flex;gap:8px;}
.jl .field{flex:1;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  font:inherit;font-size:16px;color:var(--ink);}
.jl .field::placeholder{color:var(--muted);}
.jl .field.slim{flex:none;width:130px;padding:9px 11px;font-size:14px;}
.jl .field.big{font-size:19px;text-align:center;padding:14px;}
.jl .primary{width:48px;border-radius:12px;background:var(--accent);color:var(--onAccent);display:grid;place-items:center;flex:none;}
.jl .primary:active{transform:scale(.96);}

.jl .whenRow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-top:9px;}
.jl .link{color:var(--accent);font-size:12.5px;}
.jl .dateMini{margin-left:auto;background:none;border:none;color:var(--muted);font:inherit;font-size:12.5px;padding:0;}

.jl .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.jl .chip{font-size:12.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  color:var(--ink2);background:var(--surface);}
.jl .chip:hover{border-color:var(--accent);color:var(--accent);}

.jl .reminderBar{display:flex;align-items:center;gap:8px;width:100%;margin-top:16px;padding:10px 13px;
  border-radius:11px;background:var(--soft);color:var(--ink2);font-size:12.5px;text-align:left;}
.jl .reminderBar b{margin-left:auto;color:var(--accent);font-weight:600;}

.jl .empty{text-align:center;padding:50px 18px;}
.jl .empty h2{font-size:17px;font-weight:600;margin:0 0 6px;}
.jl .empty p{color:var(--muted);font-size:14px;margin:0 auto;max-width:32ch;line-height:1.55;}

.jl .log{padding-top:14px;}
.jl .dayHead{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 4px;}
.jl .dayHead h2{font-size:13px;font-weight:600;margin:0;letter-spacing:-.01em;}
.jl .dayHead span{font-size:12px;color:var(--muted);}
.jl .log ul{list-style:none;margin:0;padding:0;}
.jl .log li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.jl .time{font-size:12px;color:var(--muted);width:62px;flex:none;font-variant-numeric:tabular-nums;}
.jl .name{flex:1;font-size:15.5px;}
.jl .del{color:var(--muted);opacity:.55;padding:4px;display:grid;place-items:center;}
.jl .del:hover{opacity:1;color:var(--red);}

.jl .report{padding-top:6px;}
.jl .monthNav{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;}
.jl .monthNav h2{font-size:16px;font-weight:600;margin:0;}
.jl .big{padding:14px 0 6px;display:flex;align-items:baseline;gap:10px;}
.jl .big b{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--accent);}
.jl .big span{font-size:14px;color:var(--muted);}
.jl .stats{display:flex;gap:8px;margin:16px 0 4px;}
.jl .stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;}
.jl .stats b{display:block;font-size:19px;font-weight:600;}
.jl .stats i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;}
.jl .compare{font-size:13px;color:var(--ink2);margin:14px 0 0;}
.jl h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:28px 0 10px;}
.jl .bars{list-style:none;margin:0;padding:0;}
.jl .bars li{display:flex;align-items:center;gap:10px;padding:6px 0;}
.jl .barName{width:32%;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jl .track{flex:1;height:10px;background:var(--surface);border-radius:6px;overflow:hidden;}
.jl .bar{display:block;height:100%;background:var(--accent);border-radius:6px;}
.jl .barN{width:22px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.jl .foot{font-size:13px;color:var(--muted);margin:14px 0 0;}
.jl .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.jl .cell{aspect-ratio:1;border-radius:7px;background:var(--accent);display:grid;place-items:center;
  font-size:11px;color:var(--onAccent);font-weight:600;}

.jl .onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:32px 26px 40px;max-width:480px;margin:0 auto;text-align:left;}
.jl .onbBody{flex:none;}
.jl .onbMark{display:flex;align-items:flex-end;gap:7px;height:52px;margin-bottom:26px;}
.jl .onbMark span{width:17px;border-radius:5px;background:var(--accent);opacity:.45;}
.jl .onbMark span:nth-child(1){height:30px;}
.jl .onbMark span:nth-child(2){height:52px;opacity:1;}
.jl .onbMark span:nth-child(3){height:20px;}
.jl .onb h2{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:0 0 12px;}
.jl .onb p{font-size:15px;line-height:1.6;color:var(--ink2);margin:0 0 24px;max-width:36ch;}
.jl .presets{display:flex;gap:8px;margin-bottom:20px;}
.jl .preset{flex:1;padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;color:var(--ink2);}
.jl .preset.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent);font-weight:600;}
.jl .onbLbl{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;}
.jl .recap{display:flex;align-items:center;gap:9px;background:var(--soft);border-radius:12px;
  padding:14px;font-size:14.5px;color:var(--ink);margin-bottom:24px;}
.jl .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:22px;
  padding:15px;border-radius:14px;background:var(--accent);color:var(--onAccent);font-size:15.5px;font-weight:600;}
.jl .cta:active{transform:scale(.985);}
.jl .skip{display:block;width:100%;margin-top:12px;padding:10px;font-size:13.5px;color:var(--muted);}
.jl .dots{display:flex;gap:6px;justify-content:center;margin-top:40px;}
.jl .dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}
.jl .dots span.on{background:var(--accent);}

.jl .sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;}
.jl .sheetBar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px;
  border-bottom:1px solid var(--line);flex:none;font-size:15px;}
.jl .sheetBody{overflow-y:auto;padding:4px 18px 40px;max-width:560px;width:100%;margin:0 auto;}
.jl .setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.jl .setRow em{font-style:normal;font-size:13px;}
.jl .setRow em.ok{color:var(--ok);}
.jl .setRow em.warn{color:var(--red);}
.jl .sw{width:46px;height:27px;border-radius:16px;background:var(--line);position:relative;flex:none;}
.jl .sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--ink2);
  transition:transform .16s ease,background .16s ease;}
.jl .sw.on{background:var(--accent);}
.jl .sw.on i{transform:translateX(19px);background:var(--onAccent);}
.jl .note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:12px 0 0;}

.jl .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center;padding:24px;}
.jl .box{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:320px;width:100%;}
.jl .box p{margin:0 0 16px;font-size:15px;}
.jl .box div{display:flex;gap:8px;justify-content:flex-end;}
.jl .ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);
  border-radius:20px;font-size:13px;color:var(--ink2);}
.jl .ghost.wide{width:100%;justify-content:center;padding:12px;margin-top:14px;font-size:13.5px;}
.jl .ghost.danger{color:var(--red);border-color:var(--red);}

.jl .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--raise);
  border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:22px;font-size:13px;
  z-index:70;display:flex;align-items:center;gap:6px;white-space:nowrap;}

@media (prefers-reduced-motion:reduce){ .jl *{transition:none!important;} }
