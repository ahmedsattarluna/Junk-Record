<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0F1E">
<title>Sleep</title>
<style>
:root{
  --bg:#0B0F1E;
  --surface:#141A30;
  --surface-2:#1C2340;
  --line:#262E52;
  --text:#ECEEFF;
  --muted:#8C93B8;
  --accent:#7C6CFF;
  --accent-hi:#A99CFF;
  --accent-lo:#3B3675;
  --target:rgba(169,156,255,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:20px 0 40px}
#app{max-width:520px;margin:0 auto;padding:0 18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}

.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;letter-spacing:-.3px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}

.card{background:var(--surface);border-radius:24px;padding:18px}
.card + .card{margin-top:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}

/* plan card */
.targets{display:flex;justify-content:space-between;margin-top:10px}
.targets div span{display:block;font-size:13px;color:var(--muted)}
.targets div b{font-size:26px;font-weight:700;letter-spacing:-.3px}
.targets .r{text-align:right}
.prog{margin-top:16px}
.prog .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.prog .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.next{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;line-height:1.4}
.next b{color:var(--accent-hi)}
.tip{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.45;display:flex;gap:8px}
.tip svg{flex:none;margin-top:1px;color:var(--accent-hi)}
.start{margin-top:14px;width:100%;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:16px}
.intro{font-size:15px;line-height:1.45;color:var(--muted);margin:8px 0 0}
.intro b{color:var(--text)}

/* log card */
.daynav{display:flex;align-items:center;justify-content:space-between}
.daynav .lbl{text-align:center}
.daynav .lbl b{display:block;font-size:16px;font-weight:600}
.daynav .lbl span{font-size:13px;color:var(--muted)}
.chev{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--text)}
.chev:disabled{opacity:.25}
.readout{display:flex;justify-content:space-between;align-items:flex-end;margin:20px 2px 4px}
.readout .t span{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.readout .t b{font-size:24px;font-weight:700;letter-spacing:-.3px}
.readout .t.r{text-align:right}
.dur{text-align:center;font-size:14px;color:var(--muted);font-weight:600}
.range{position:relative;height:56px;margin:6px 4px 0;touch-action:none}
.range .track{position:absolute;left:0;right:0;top:22px;height:12px;border-radius:99px;background:var(--surface-2)}
.range .tgt{position:absolute;top:18px;height:20px;border-radius:99px;border:1.5px dashed rgba(169,156,255,.55)}
.range .fill{position:absolute;top:22px;height:12px;border-radius:99px;background:var(--accent)}
.range .thumb{position:absolute;top:12px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45);display:grid;place-items:center;color:var(--accent)}
.range .thumb.active{transform:scale(1.12)}
.ticks{position:relative;height:14px;margin:0 4px 2px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.verdict{margin-top:12px;text-align:center;font-size:14px;font-weight:600}
.verdict.hit{color:var(--accent-hi)}
.verdict.miss{color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:14px}
.ok{flex:1;background:var(--accent);color:#fff;font-weight:700;font-size:17px;padding:15px;border-radius:16px}
.del{width:54px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}

/* chart */
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.pnav{display:flex;gap:6px}
.pnav .chev{width:32px;height:32px;border-radius:10px}
.ptitle{font-size:13px;color:var(--muted);margin:14px 0 0}
.tl{display:flex;margin-top:12px}
.yax{position:relative;width:38px;flex:none;font-size:10px;color:var(--muted)}
.yax span{position:absolute;right:6px;transform:translateY(-50%);white-space:nowrap}
.plot{position:relative;flex:1;height:260px}
.grid{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.cols{position:absolute;inset:0;display:flex;gap:6px}
.cols.month{gap:2px}
.c{position:relative;flex:1;min-width:0}
.c .tw{position:absolute;left:0;right:0;background:var(--target);border-radius:6px}
.c .sb{position:absolute;left:18%;right:18%;border-radius:6px;background:var(--accent-lo)}
.month .c .sb{left:8%;right:8%;border-radius:3px}
.month .c .tw{border-radius:3px}
.c .sb.hit{background:var(--accent)}
.c.sel .sb{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.xl{display:flex;gap:6px;margin:8px 0 0 38px}
.xl.month{gap:2px}
.xl div{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;white-space:nowrap}
.xl div.sel{color:var(--text);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.stats span{display:block;font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:18px;font-weight:700;margin-top:3px}
.stats em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,7,15,.72);z-index:10;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px 26px;max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.4}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.row .l b{display:block;font-size:15px}
.row .l span{font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:38px;height:38px;border-radius:11px;background:var(--surface-2);font-size:20px;font-weight:600}
.step output{min-width:78px;text-align:center;font-weight:700;font-size:16px}
.speed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.speed button{background:var(--surface-2);border-radius:14px;padding:10px 6px;text-align:center}
.speed button b{display:block;font-size:14px}
.speed button span{font-size:11px;color:var(--muted)}
.speed button.on{background:var(--accent)}
.speed button.on span{color:#E4E0FF}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--surface-2);position:relative;transition:.2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--accent)}
.toggle.on:after{left:23px}
.eta{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 2px}
.eta b{color:var(--text)}
.save{width:100%;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:16px;margin-top:10px}
.link{width:100%;padding:12px;margin-top:6px;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-16px);background:var(--text);color:var(--bg);font-weight:600;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const I = {
  moon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>',
  left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  trash: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  bed: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>',
  sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  bulb: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2Z"/></svg>'
};

/* ===== Time model =====
   Every night is stored under its wake-up date.
   Times are minutes after 8:00 PM of the evening before (0 = 8 PM … 1320 = 6 PM next day). */
const ORIGIN = 1200, SPAN = 1320, STEP = 15, MIN_GAP = 60, GRACE = 30;
const KEY = "sleep_v2";

let S = { nights: {}, plan: null };
try {
  const r = JSON.parse(localStorage.getItem(KEY));
  if (r && r.nights) S = r;
  else {
    const old = JSON.parse(localStorage.getItem("sleep_v1"));          // migrate v1 (6 PM origin)
    if (old && old.nights) for (const k in old.nights) {
      const n = old.nights[k], b = Math.max(0, n.b - 120), w = Math.max(b + MIN_GAP, n.w - 120);
      S.nights[k] = { b, w };
    }
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const key = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const clock = rel => { const m = ((Math.round(rel) + ORIGIN) % 1440 + 1440) % 1440; let h = Math.floor(m / 60); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + pad(m % 60) + " " + ap; };
const hm = m => { m = Math.round(Math.abs(m)); const h = Math.floor(m / 60), r = m % 60; return h ? h + "h" + (r ? " " + r + "m" : "") : r + "m"; };
const relToDate = (wakeDay, rel) => new Date(addDays(wakeDay, -1).getTime() + (20 * 60 + rel) * 60000);

/* ===== Shift plan =====
   The wake-up target moves earlier by `step` minutes after every `every` on-target nights.
   On target = woke up no later than target + 30 min. Bedtime target = wake target − sleep need. */
const SPEEDS = [
  { id: "gentle", name: "Gentle", step: 15, every: 3 },
  { id: "steady", name: "Steady", step: 15, every: 2 },
  { id: "faster", name: "Faster", step: 30, every: 2 }
];
const speed = id => SPEEDS.find(s => s.id === id) || SPEEDS[1];

function planState(upToKey) {             // target for the night that ends on upToKey
  const P = S.plan; if (!P) return null;
  const sp = speed(P.speed);
  let level = 0, hits = 0;
  const maxLevel = Math.ceil((P.startWake - P.goalWake) / sp.step);
  for (let d = fromKey(P.start); key(d) < upToKey; d = addDays(d, 1)) {
    const n = S.nights[key(d)];
    if (!n) continue;
    const t = Math.max(P.goalWake, P.startWake - level * sp.step);
    if (n.w <= t + GRACE) { hits++; if (hits >= sp.every && level < maxLevel) { level++; hits = 0; } }
  }
  const wake = Math.max(P.goalWake, P.startWake - level * sp.step);
  return { wake, bed: wake - P.need, level, maxLevel, hits, every: sp.every, step: sp.step, done: wake <= P.goalWake };
}
const hit = (k, n) => { if (!S.plan || k < S.plan.start) return null; const t = planState(k); return n.w <= t.wake + GRACE; };

/* ===== State ===== */
let day = today(), draft = null, view = "week", off = 0;
function lastTimes() { const ks = Object.keys(S.nights).sort(); return ks.length ? { ...S.nights[ks[ks.length - 1]] } : { b: 540, w: 1050 }; }
function loadDraft() { const n = S.nights[key(day)]; draft = n ? { b: n.b, w: n.w } : lastTimes(); }

const TIPS = [
  "Get outside light within 30 minutes of waking up. Morning light is the strongest signal that pulls your body clock earlier.",
  "Wake up at the same time on weekends too. Sleeping in by more than an hour pushes the next night later.",
  "Dim lights and screens for the last hour before your target bedtime. Bright light at night pushes your clock later.",
  "Skip naps while you're shifting. They make it harder to fall asleep at your earlier target.",
  "Stop caffeine about 12 hours before your target bedtime, and move the cutoff earlier as bedtime moves.",
  "Can't fall asleep? Still get up at your target wake time. The early wake-up is what builds sleep pressure for the next night.",
  "Eat meals and exercise a little earlier each day along with your schedule. They help set your body clock too."
];

/* ===== Render ===== */
function planCard() {
  if (!S.plan) return `<div class="card"><div class="eyebrow">Your goal</div>
    <p class="intro">Pick the schedule you want to live on. Each night the app gives you a <b>wake-up target</b> that moves a little earlier every time you hit it, until you reach your goal.</p>
    <button class="start" data-act="plan">Set my goal schedule</button></div>`;
  const P = S.plan, st = planState(key(addDays(today(), 1)));     // tonight → wake tomorrow
  const total = P.startWake - P.goalWake, doneMin = P.startWake - st.wake;
  const pct = total > 0 ? Math.round(doneMin / total * 100) : 100;
  const left = st.every - st.hits;
  const tip = TIPS[Math.floor(today() / 864e5) % TIPS.length];
  return `<div class="card">
    <div class="eyebrow">Tonight's target</div>
    <div class="targets"><div><span>In bed by</span><b>${clock(st.bed)}</b></div><div class="r"><span>Wake up at</span><b>${clock(st.wake)}</b></div></div>
    <div class="prog"><div class="bar"><i style="width:${Math.max(3, pct)}%"></i></div>
      <div class="meta"><span>Started ${clock(P.startWake)}</span><span>Goal ${clock(P.goalWake)}</span></div></div>
    <div class="next">${st.done ? `<b>You've reached your goal.</b> Keep waking at ${clock(P.goalWake)} every day, weekends included.`
      : `Wake up by <b>${clock(st.wake + GRACE)}</b> ${left === 1 ? "once more" : left + " more times"} to move your target <b>${st.step} min earlier</b>. ${hm(doneMin)} shifted, ${hm(total - doneMin)} to go.`}</div>
    <div class="tip">${I.bulb}<span>${tip}</span></div>
  </div>`;
}

function logCard() {
  const k = key(day), n = S.nights[k], atToday = k === key(today());
  const diff = Math.round((today() - day) / 864e5), prev = addDays(day, -1);
  const title = diff === 0 ? "Last night" : diff === 1 ? "Night before last" : DOW[prev.getDay()] + " night";
  const st = S.plan && k >= S.plan.start ? planState(k) : null;
  let verdict = "";
  if (n && st) {
    const late = n.w - st.wake;
    verdict = n.w <= st.wake + GRACE
      ? `<div class="verdict hit">On target · woke ${late <= 0 ? hm(-late) + " early" : hm(late) + " after target"}</div>`
      : `<div class="verdict miss">Missed · woke ${hm(late)} after the ${clock(st.wake)} target</div>`;
  }
  const ticks = [0, 240, 480, 720, 960, 1200].map(r => `<span style="left:${r / SPAN * 100}%">${clock(r).replace(":00", "").replace(" ", "")}</span>`).join("");
  return `<div class="card">
    <div class="daynav">
      <button class="chev" data-act="dprev" aria-label="Previous night">${I.left}</button>
      <div class="lbl"><b>${title}</b><span>${DOW[prev.getDay()]} ${prev.getDate()} → ${DOW[day.getDay()]} ${day.getDate()} ${MON[day.getMonth()]}</span></div>
      <button class="chev" data-act="dnext" aria-label="Next night" ${atToday ? "disabled" : ""}>${I.right}</button>
    </div>
    <div class="readout">
      <div class="t"><span>Slept</span><b id="rb"></b></div>
      <div class="t r"><span>Woke up</span><b id="rw"></b></div>
    </div>
    <div class="dur" id="rd"></div>
    <div class="range" id="range">
      <div class="track"></div>
      ${st ? `<div class="tgt" style="left:${st.bed / SPAN * 100}%;width:${(st.wake - st.bed) / SPAN * 100}%"></div>` : ""}
      <div class="fill" id="fill"></div>
      <div class="thumb" id="tb">${I.bed}</div><div class="thumb" id="tw">${I.sun}</div>
    </div>
    <div class="ticks">${ticks}</div>
    ${verdict}
    <div class="actions">
      <button class="ok" data-act="ok">${n ? "Update" : "OK"}</button>
      ${n ? `<button class="del" data-act="del" aria-label="Delete">${I.trash}</button>` : ""}
    </div>
  </div>`;
}

function period() {
  const t = today();
  if (view === "week") {
    const end = addDays(t, off * 7), start = addDays(end, -6), ks = [];
    for (let i = 0; i < 7; i++) ks.push(key(addDays(start, i)));
    return { ks, title: start.getDate() + " " + MON[start.getMonth()] + " – " + end.getDate() + " " + MON[end.getMonth()] };
  }
  const first = new Date(t.getFullYear(), t.getMonth() + off, 1), last = new Date(first.getFullYear(), first.getMonth() + 1, 0), ks = [];
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) ks.push(key(d));
  return { ks, title: MON[first.getMonth()] + " " + first.getFullYear() };
}

function chartCard() {
  const P = period(), month = view === "month", sel = key(day), tk = key(today());
  // vertical window: fit data + targets, at least 12 h, snapped to 2 h
  let lo = Infinity, hi = -Infinity;
  P.ks.forEach(k => {
    const n = S.nights[k]; if (n) { lo = Math.min(lo, n.b); hi = Math.max(hi, n.w); }
    if (S.plan && k >= S.plan.start && k <= key(addDays(today(), 1))) { const s = planState(k); lo = Math.min(lo, s.bed); hi = Math.max(hi, s.wake); }
  });
  if (lo === Infinity) { lo = 240; hi = 1080; }
  lo = Math.max(0, Math.floor((lo - 30) / 120) * 120); hi = Math.min(SPAN, Math.ceil((hi + 30) / 120) * 120);
  if (hi - lo < 720) { const pad2 = (720 - (hi - lo)) / 2; lo = Math.max(0, lo - pad2); hi = Math.min(SPAN, lo + 720); lo = Math.max(0, hi - 720); }
  const y = r => (r - lo) / (hi - lo) * 100;

  const grid = [], ylab = [];
  for (let r = Math.ceil(lo / 120) * 120; r <= hi; r += 120) {
    grid.push(`<div class="grid" style="top:${y(r)}%"></div>`);
    ylab.push(`<span style="top:${y(r)}%">${clock(r).replace(":00", "").replace(" ", "")}</span>`);
  }
  const cols = P.ks.map(k => {
    const n = S.nights[k];
    let tw = "";
    if (S.plan && k >= S.plan.start && k <= tk) { const s = planState(k); tw = `<div class="tw" style="top:${y(s.bed)}%;height:${y(s.wake) - y(s.bed)}%"></div>`; }
    const h = n ? hit(k, n) : null;
    const sb = n ? `<div class="sb ${h === false ? "" : "hit"}" style="top:${y(n.b)}%;height:${y(n.w) - y(n.b)}%"></div>` : "";
    return `<div class="c ${k === sel ? "sel" : ""}" data-k="${k}">${tw}${sb}</div>`;
  }).join("");
  const xl = P.ks.map(k => { const d = fromKey(k); const t = month ? ([1, 8, 15, 22, 29].includes(d.getDate()) ? d.getDate() : "") : DOW[d.getDay()][0]; return `<div class="${k === sel ? "sel" : ""}">${t}</div>`; }).join("");

  const logged = P.ks.filter(k => S.nights[k] && k <= tk);
  const ns = logged.map(k => S.nights[k]);
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
  const judged = logged.filter(k => hit(k, S.nights[k]) !== null);
  const hits = judged.filter(k => hit(k, S.nights[k])).length;
  const reg = ns.length >= 2 ? Math.round((sd(ns.map(n => n.b)) + sd(ns.map(n => n.w))) / 2) : null;

  return `<div class="card">
    <div class="chead">
      <div class="seg"><button class="${view === "week" ? "on" : ""}" data-view="week">Week</button><button class="${month ? "on" : ""}" data-view="month">Month</button></div>
      <div class="pnav"><button class="chev" data-act="pprev" aria-label="Previous">${I.left}</button><button class="chev" data-act="pnext" aria-label="Next" ${off >= 0 ? "disabled" : ""}>${I.right}</button></div>
    </div>
    <div class="ptitle">${P.title} · when you slept</div>
    <div class="tl"><div class="yax">${ylab.join("")}</div><div class="plot">${grid.join("")}<div class="cols ${month ? "month" : ""}">${cols}</div></div></div>
    <div class="xl ${month ? "month" : ""}">${xl}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>On target</span><span><i style="background:var(--accent-lo)"></i>Missed</span>${S.plan ? `<span><i style="background:rgba(169,156,255,.3)"></i>Target window</span>` : ""}</div>
    <div class="stats">
      <div><span>Avg asleep at</span><b>${ns.length ? clock(mean(ns.map(n => n.b))) : "–"}</b></div>
      <div><span>Avg woke up at</span><b>${ns.length ? clock(mean(ns.map(n => n.w))) : "–"}</b></div>
      <div><span>Regularity</span><b>${reg === null ? "–" : "±" + hm(reg)} <em>${reg === null ? "" : reg <= 30 ? "steady" : reg <= 60 ? "fair" : "irregular"}</em></b></div>
      <div><span>On target</span><b>${judged.length ? hits + "/" + judged.length : "–"} <em>${ns.length ? "· avg " + hm(mean(ns.map(n => n.w - n.b))) + " sleep" : ""}</em></b></div>
    </div>
  </div>`;
}

function render() {
  $("#app").innerHTML = `<div class="top"><div class="brand"><div class="logo">${I.moon}</div>Sleep</div>
    <button class="icon-btn" data-act="plan" aria-label="Goal schedule">${I.gear}</button></div>
    ${planCard()}${logCard()}${chartCard()}`;
  paintRange(); bindRange();
}

/* ===== Slider ===== */
function paintRange() {
  const pb = draft.b / SPAN * 100, pw = draft.w / SPAN * 100;
  $("#tb").style.left = pb + "%"; $("#tw").style.left = pw + "%";
  $("#fill").style.left = pb + "%"; $("#fill").style.width = (pw - pb) + "%";
  $("#rb").textContent = clock(draft.b); $("#rw").textContent = clock(draft.w);
  $("#rd").textContent = hm(draft.w - draft.b) + " of sleep";
}
function bindRange() {
  const el = $("#range"); let which = null;
  const val = x => { const r = el.getBoundingClientRect(); return Math.max(0, Math.min(SPAN, Math.round((x - r.left) / r.width * SPAN / STEP) * STEP)); };
  const move = x => { const v = val(x); if (which === "b") draft.b = Math.min(v, draft.w - MIN_GAP); else draft.w = Math.max(v, draft.b + MIN_GAP); paintRange(); };
  el.addEventListener("pointerdown", e => {
    const v = val(e.clientX);
    which = Math.abs(v - draft.b) < Math.abs(v - draft.w) ? "b" : Math.abs(v - draft.b) > Math.abs(v - draft.w) ? "w" : (v < draft.b ? "b" : "w");
    el.setPointerCapture(e.pointerId); $(which === "b" ? "#tb" : "#tw").classList.add("active"); move(e.clientX);
  });
  el.addEventListener("pointermove", e => { if (which) move(e.clientX); });
  const end = () => { if (which) { $(which === "b" ? "#tb" : "#tw").classList.remove("active"); which = null; } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

/* ===== Plan sheet ===== */
let F = null;
function usualWake() {
  const ks = Object.keys(S.nights).sort().slice(-7);
  if (ks.length < 3) return 1050;                               // 1:30 PM
  return Math.round(ks.reduce((s, k) => s + S.nights[k].w, 0) / ks.length / 15) * 15;
}
function openPlan() {
  const P = S.plan, st = P ? planState(key(addDays(today(), 1))) : null;
  F = { startWake: st ? st.wake : usualWake(), goalWake: P ? P.goalWake : 750, need: P ? P.need : 510, speed: P ? P.speed : "steady", remind: P ? P.remind : true };
  paintPlan();
}
function paintPlan() {
  const sp = speed(F.speed), steps = Math.max(0, Math.ceil((F.startWake - F.goalWake) / sp.step)), nights = steps * sp.every;
  const wk = nights / 7;
  $("#sheet").innerHTML = `<div class="sheet-bg" id="bg"><div class="sheet">
    <h3>Goal schedule</h3>
    <p class="sub">Set your wake-up time first. It's the anchor that moves your body clock. Your bedtime target is worked out from your sleep need.</p>
    <div class="row"><div class="l"><b>I usually wake up at</b><span>where the plan starts</span></div>
      <div class="step"><button data-f="startWake" data-d="-15">−</button><output>${clock(F.startWake)}</output><button data-f="startWake" data-d="15">+</button></div></div>
    <div class="row"><div class="l"><b>Goal wake-up</b><span>bed by ${clock(F.goalWake - F.need)}</span></div>
      <div class="step"><button data-f="goalWake" data-d="-15">−</button><output>${clock(F.goalWake)}</output><button data-f="goalWake" data-d="15">+</button></div></div>
    <div class="row"><div class="l"><b>Sleep I need</b><span>you average about 8–9 h</span></div>
      <div class="step"><button data-f="need" data-d="-30">−</button><output>${hm(F.need)}</output><button data-f="need" data-d="30">+</button></div></div>
    <div class="row" style="display:block"><div class="l" style="margin-bottom:10px"><b>Pace</b><span>you move earlier only after on-target nights</span></div>
      <div class="speed">${SPEEDS.map(s => `<button class="${F.speed === s.id ? "on" : ""}" data-speed="${s.id}"><b>${s.name}</b><span>${s.step} min / ${s.every} nights</span></button>`).join("")}</div></div>
    <div class="row"><div class="l"><b>Reminders</b><span>wind down 1 h before bed, and at wake-up</span></div>
      <button class="toggle ${F.remind ? "on" : ""}" data-act="remind" aria-label="Reminders"></button></div>
    <div class="eta">${steps ? `About <b>${nights} on-target nights</b> (${wk < 1.5 ? Math.round(nights) + " days" : "≈" + Math.round(wk) + " weeks"}) to reach ${clock(F.goalWake)}.` : "You're already at your goal. The app will hold you there."}</div>
    <button class="save" data-act="saveplan">${S.plan ? "Save changes" : "Start plan"}</button>
    ${S.plan ? `<button class="link" data-act="endplan">Stop the plan</button>` : ""}
  </div></div>`;
}

/* ===== Reminders (Android local notifications) ===== */
const native = (m, o) => window.Capacitor && window.Capacitor.nativePromise ? window.Capacitor.nativePromise("LocalNotifications", m, o || {}) : Promise.reject("web");
async function scheduleReminders(ask) {
  try {
    const pend = await native("getPending");
    if (pend && pend.notifications && pend.notifications.length) await native("cancel", { notifications: pend.notifications.map(n => ({ id: Number(n.id) })) });
    if (!S.plan || !S.plan.remind) return;
    let perm = await native("checkPermissions");
    if (perm.display !== "granted" && ask) perm = await native("requestPermissions");
    if (perm.display !== "granted") return;
    const list = [], now = Date.now();
    for (let i = 0; i < 10; i++) {
      const wd = addDays(today(), i), st = planState(key(wd));
      const wind = relToDate(wd, st.bed - 60), wake = relToDate(wd, st.wake);
      if (wind.getTime() > now) list.push({ id: 100 + i, title: "Time to wind down", body: "Dim the lights and put the phone away. Aim to be in bed by " + clock(st.bed) + ".", schedule: { at: wind.toISOString(), allowWhileIdle: true }, smallIcon: "ic_stat_moon", iconColor: "#7C6CFF" });
      if (wake.getTime() > now) list.push({ id: 200 + i, title: "Wake-up target: " + clock(st.wake), body: "Get up now and get daylight in the next 30 minutes. Then log last night.", schedule: { at: wake.toISOString(), allowWhileIdle: true }, smallIcon: "ic_stat_moon", iconColor: "#7C6CFF" });
    }
    if (list.length) await native("schedule", { notifications: list });
  } catch (e) {}
}

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800); }

/* ===== Events ===== */
document.addEventListener("click", e => {
  if (e.target.id === "bg") { $("#sheet").innerHTML = ""; return; }
  const col = e.target.closest(".c[data-k]");
  if (col) { if (col.dataset.k <= key(today())) { day = fromKey(col.dataset.k); loadDraft(); render(); } return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { view = b.dataset.view; off = 0; render(); return; }
  if (b.dataset.f) {
    const f = b.dataset.f, d = +b.dataset.d;
    if (f === "need") F.need = Math.min(600, Math.max(360, F.need + d));
    else F[f] = Math.min(SPAN - 60, Math.max(F.need, F[f] + d));
    if (F.goalWake > F.startWake) { if (f === "goalWake") F.startWake = F.goalWake; else F.goalWake = F.startWake; }
    paintPlan(); return;
  }
  if (b.dataset.speed) { F.speed = b.dataset.speed; paintPlan(); return; }
  switch (b.dataset.act) {
    case "ok": {
      const k = key(day); S.nights[k] = { b: draft.b, w: draft.w }; save();
      const h = hit(k, S.nights[k]);
      toast(h === null ? "Saved" : h ? "On target, nice" : "Saved · missed target");
      render(); scheduleReminders(false); break;
    }
    case "del": delete S.nights[key(day)]; save(); loadDraft(); toast("Deleted"); render(); scheduleReminders(false); break;
    case "dprev": day = addDays(day, -1); loadDraft(); render(); break;
    case "dnext": if (key(day) !== key(today())) { day = addDays(day, 1); loadDraft(); render(); } break;
    case "pprev": off--; render(); break;
    case "pnext": if (off < 0) { off++; render(); } break;
    case "plan": openPlan(); break;
    case "remind": F.remind = !F.remind; paintPlan(); break;
    case "saveplan":
      // the plan starts with tonight (wake-up tomorrow); earlier nights stay as history
      S.plan = { start: key(addDays(today(), 1)), startWake: F.startWake, goalWake: F.goalWake, need: F.need, speed: F.speed, remind: F.remind };
      save(); $("#sheet").innerHTML = ""; render(); toast("Plan saved"); scheduleReminders(true); break;
    case "endplan": S.plan = null; save(); $("#sheet").innerHTML = ""; render(); scheduleReminders(false); break;
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (key(day) > key(today())) day = today(); loadDraft(); render(); scheduleReminders(false); } });

loadDraft();
render();
scheduleReminders(false);
</script>
</body>
</html>
