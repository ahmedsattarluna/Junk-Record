<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0F1E">
<title>Sleep</title>
<style>
:root{
  --bg:#0B0F1E;
  --surface:#141A30;
  --surface-2:#1C2340;
  --line:#262E52;
  --text:#ECEEFF;
  --muted:#8C93B8;
  --accent:#7C6CFF;
  --accent-hi:#A99CFF;
  --accent-lo:#3B3675;
  --accent-grad:linear-gradient(180deg,#A99CFF 0%,#7C6CFF 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:20px 0 40px}
#app{max-width:520px;margin:0 auto;padding:0 18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px}
.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;letter-spacing:-.3px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface-2)}

.card{background:var(--surface);border-radius:24px;padding:18px}
.card + .card{margin-top:14px}

/* log card */
.daynav{display:flex;align-items:center;justify-content:space-between}
.daynav .lbl{text-align:center}
.daynav .lbl b{display:block;font-size:16px;font-weight:600}
.daynav .lbl span{font-size:13px;color:var(--muted)}
.chev{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--text)}
.chev:disabled{opacity:.25}

.readout{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 2px 6px}
.readout .t span{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.readout .t b{font-size:24px;font-weight:700;letter-spacing:-.3px}
.readout .t.r{text-align:right}
.dur{text-align:center;font-size:15px;color:var(--accent-hi);font-weight:600;margin-bottom:2px}

.range{position:relative;height:56px;margin:8px 4px 0;touch-action:none}
.range .track{position:absolute;left:0;right:0;top:22px;height:12px;border-radius:99px;background:var(--surface-2)}
.range .fill{position:absolute;top:22px;height:12px;border-radius:99px;background:var(--accent)}
.range .thumb{position:absolute;top:12px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45);display:grid;place-items:center;color:var(--accent)}
.range .thumb.active{transform:scale(1.12)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:0 0 4px}

.actions{display:flex;gap:10px;margin-top:16px}
.ok{flex:1;background:var(--accent);color:#fff;font-weight:700;font-size:17px;padding:15px;border-radius:16px}
.ok:active{background:#6A5AF0}
.del{width:54px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}

/* chart card */
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.pnav{display:flex;align-items:center;gap:6px}
.pnav .chev{width:32px;height:32px;border-radius:10px}
.ptitle{font-size:13px;color:var(--muted);margin:14px 0 0}

.chart{position:relative;height:170px;margin-top:14px}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:8px}
.bars.month{gap:3px}
.bcol{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bar{width:100%;border-radius:8px 8px 4px 4px;background:var(--accent-lo);transition:height .4s cubic-bezier(.2,.8,.2,1)}
.month .bar{border-radius:3px}
.bar.met{background:var(--accent-grad)}
.bar.none{background:var(--surface-2);height:4px!important}
.bcol.sel .bar{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(236,238,255,.35);pointer-events:none}
.goal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted)}
.labels{display:flex;gap:8px;margin-top:8px}
.labels.month{gap:3px}
.labels div{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:visible;white-space:nowrap}
.labels div.sel{color:var(--text);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stats div span{display:block;font-size:12px;color:var(--muted)}
.stats div b{display:block;font-size:17px;font-weight:700;margin-top:3px}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,7,15,.7);z-index:10;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px 28px}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p{margin:0 0 18px;color:var(--muted);font-size:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:16px;padding:8px}
.stepper button{width:48px;height:48px;border-radius:12px;background:var(--surface);font-size:24px;font-weight:600}
.stepper b{font-size:26px}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-weight:600;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---- icons (single line style) ---- */
const I = {
  moon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>',
  left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  trash: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  bed: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>',
  sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};

/* ---- storage ----
   One entry per night, keyed by the wake-up date.
   b / w = minutes after 6:00 PM of the previous evening (0 … 1200 = 2:00 PM). */
const KEY = "sleep_v1";
let S = { goal: 8, nights: {} };
try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.nights) S = r; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---- helpers ---- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const SPAN = 1200, STEP = 15, MIN_GAP = 30;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const key = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const clock = rel => { const m = (Math.round(rel) + 1080) % 1440; let h = Math.floor(m / 60); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + pad(m % 60) + " " + ap; };
const dur = m => { m = Math.round(m); return Math.floor(m / 60) + "h " + pad(m % 60) + "m"; };
const nightLen = n => n ? n.w - n.b : 0;

/* ---- state ---- */
let day = today();            // night being edited (wake-up date)
let draft = null;             // {b, w}
let view = "week", off = 0;

function lastTimes() {
  const ks = Object.keys(S.nights).sort();
  return ks.length ? { ...S.nights[ks[ks.length - 1]] } : { b: 300, w: 780 }; // 11 PM → 7 AM
}
function loadDraft() { const n = S.nights[key(day)]; draft = n ? { b: n.b, w: n.w } : lastTimes(); }

/* ---- period ---- */
function period() {
  const t = today();
  if (view === "week") {
    const end = addDays(t, off * 7), start = addDays(end, -6), ks = [];
    for (let i = 0; i < 7; i++) ks.push(key(addDays(start, i)));
    const title = start.getDate() + " " + MON[start.getMonth()] + " – " + end.getDate() + " " + MON[end.getMonth()];
    return { ks, title };
  }
  const first = new Date(t.getFullYear(), t.getMonth() + off, 1), last = new Date(first.getFullYear(), first.getMonth() + 1, 0), ks = [];
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) ks.push(key(d));
  return { ks, title: MON[first.getMonth()] + " " + first.getFullYear() };
}

/* ---- render ---- */
function dayLabel() {
  const diff = Math.round((today() - day) / 864e5);
  const prev = addDays(day, -1);
  const title = diff === 0 ? "Last night" : diff === 1 ? "Night before last" : DOW[prev.getDay()] + " night";
  return { title, sub: DOW[prev.getDay()] + " " + prev.getDate() + " → " + DOW[day.getDay()] + " " + day.getDate() + " " + MON[day.getMonth()] };
}

function render() {
  const L = dayLabel(), exists = !!S.nights[key(day)], atToday = key(day) === key(today());
  const P = period(), goal = S.goal * 60, tk = key(today());
  const vals = P.ks.map(k => nightLen(S.nights[k]));
  const mx = Math.max(10 * 60, ...vals) * 1.08;
  const month = view === "month";
  const selK = key(day);

  const bars = P.ks.map((k, i) => {
    const v = vals[i];
    const c = !v ? "none" : v >= goal * .95 ? "met" : "";
    return `<div class="bcol ${k === selK ? "sel" : ""}" data-k="${k}"><div class="bar ${c}" style="height:${v / mx * 100}%"></div></div>`;
  }).join("");
  const labels = P.ks.map(k => {
    const d = fromKey(k);
    const t = month ? ([1, 8, 15, 22, 29].includes(d.getDate()) ? d.getDate() : "") : DOW[d.getDay()][0];
    return `<div class="${k === selK ? "sel" : ""}">${t}</div>`;
  }).join("");

  const logged = P.ks.map(k => S.nights[k]).filter(Boolean);
  const avg = f => logged.length ? logged.reduce((s, n) => s + f(n), 0) / logged.length : null;
  const aDur = avg(nightLen), aBed = avg(n => n.b), aWake = avg(n => n.w);

  $("#app").innerHTML = `
  <div class="top">
    <div class="brand"><div class="logo">${I.moon}</div>Sleep</div>
    <button class="icon-btn" data-act="goal" aria-label="Sleep goal">${I.gear}</button>
  </div>

  <div class="card">
    <div class="daynav">
      <button class="chev" data-act="dprev" aria-label="Previous night">${I.left}</button>
      <div class="lbl"><b>${L.title}</b><span>${L.sub}</span></div>
      <button class="chev" data-act="dnext" aria-label="Next night" ${atToday ? "disabled" : ""}>${I.right}</button>
    </div>
    <div class="readout">
      <div class="t"><span>Bedtime</span><b id="rb">${clock(draft.b)}</b></div>
      <div class="t r"><span>Wake up</span><b id="rw">${clock(draft.w)}</b></div>
    </div>
    <div class="dur" id="rd">${dur(draft.w - draft.b)}</div>
    <div class="range" id="range">
      <div class="track"></div><div class="fill" id="fill"></div>
      <div class="thumb" id="tb">${I.bed}</div><div class="thumb" id="tw">${I.sun}</div>
    </div>
    <div class="ticks"><span>6 PM</span><span>10 PM</span><span>2 AM</span><span>6 AM</span><span>10 AM</span><span>2 PM</span></div>
    <div class="actions">
      <button class="ok" data-act="ok">${exists ? "Update" : "OK"}</button>
      ${exists ? `<button class="del" data-act="del" aria-label="Delete">${I.trash}</button>` : ""}
    </div>
  </div>

  <div class="card">
    <div class="chead">
      <div class="seg">
        <button class="${view === "week" ? "on" : ""}" data-view="week">Week</button>
        <button class="${view === "month" ? "on" : ""}" data-view="month">Month</button>
      </div>
      <div class="pnav">
        <button class="chev" data-act="pprev" aria-label="Previous">${I.left}</button>
        <button class="chev" data-act="pnext" aria-label="Next" ${off >= 0 ? "disabled" : ""}>${I.right}</button>
      </div>
    </div>
    <div class="ptitle">${P.title}</div>
    <div class="chart">
      <div class="goal" style="bottom:${goal / mx * 100}%"><span>${S.goal}h goal</span></div>
      <div class="bars ${month ? "month" : ""}">${bars}</div>
    </div>
    <div class="labels ${month ? "month" : ""}">${labels}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Goal met</span><span><i style="background:var(--accent-lo)"></i>Under goal</span></div>
    <div class="stats">
      <div><span>Average</span><b>${aDur === null ? "–" : dur(aDur)}</b></div>
      <div><span>Bedtime</span><b>${aBed === null ? "–" : clock(aBed)}</b></div>
      <div><span>Wake up</span><b>${aWake === null ? "–" : clock(aWake)}</b></div>
    </div>
  </div>`;
  paintRange();
  bindRange();
}

/* ---- slider ---- */
function paintRange() {
  const pb = draft.b / SPAN * 100, pw = draft.w / SPAN * 100;
  $("#tb").style.left = pb + "%";
  $("#tw").style.left = pw + "%";
  $("#fill").style.left = pb + "%";
  $("#fill").style.width = (pw - pb) + "%";
  $("#rb").textContent = clock(draft.b);
  $("#rw").textContent = clock(draft.w);
  $("#rd").textContent = dur(draft.w - draft.b);
}
function bindRange() {
  const el = $("#range");
  let which = null;
  const val = x => { const r = el.getBoundingClientRect(); const v = (x - r.left) / r.width * SPAN; return Math.max(0, Math.min(SPAN, Math.round(v / STEP) * STEP)); };
  const move = x => {
    const v = val(x);
    if (which === "b") draft.b = Math.min(v, draft.w - MIN_GAP);
    else draft.w = Math.max(v, draft.b + MIN_GAP);
    paintRange();
  };
  el.addEventListener("pointerdown", e => {
    const v = val(e.clientX);
    which = Math.abs(v - draft.b) <= Math.abs(v - draft.w) ? "b" : "w";
    if (draft.b === draft.w - MIN_GAP && v > draft.w) which = "w";
    el.setPointerCapture(e.pointerId);
    $(which === "b" ? "#tb" : "#tw").classList.add("active");
    move(e.clientX);
  });
  el.addEventListener("pointermove", e => { if (which) move(e.clientX); });
  const end = () => { if (!which) return; $(which === "b" ? "#tb" : "#tw").classList.remove("active"); which = null; };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ---- goal sheet ---- */
function openGoal() {
  $("#sheet").innerHTML = `<div class="sheet-bg" id="bg"><div class="sheet">
    <h3>Sleep goal</h3><p>Hours you aim to sleep each night.</p>
    <div class="stepper"><button data-act="gminus">−</button><b id="gv">${S.goal}h</b><button data-act="gplus">+</button></div>
  </div></div>`;
}

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1400); }

/* ---- events ---- */
document.addEventListener("click", e => {
  if (e.target.id === "bg") { $("#sheet").innerHTML = ""; render(); return; }
  const col = e.target.closest(".bcol");
  if (col) { day = fromKey(col.dataset.k); loadDraft(); render(); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { view = b.dataset.view; off = 0; render(); return; }
  switch (b.dataset.act) {
    case "ok": S.nights[key(day)] = { b: draft.b, w: draft.w }; save(); toast("Saved · " + dur(draft.w - draft.b)); render(); break;
    case "del": delete S.nights[key(day)]; save(); loadDraft(); toast("Deleted"); render(); break;
    case "dprev": day = addDays(day, -1); loadDraft(); render(); break;
    case "dnext": if (key(day) !== key(today())) { day = addDays(day, 1); loadDraft(); render(); } break;
    case "pprev": off--; render(); break;
    case "pnext": if (off < 0) { off++; render(); } break;
    case "goal": openGoal(); break;
    case "gminus": S.goal = Math.max(4, S.goal - .5); save(); $("#gv").textContent = S.goal + "h"; break;
    case "gplus": S.goal = Math.min(12, S.goal + .5); save(); $("#gv").textContent = S.goal + "h"; break;
  }
});

/* keep "today" correct if the app stays open past midnight */
document.addEventListener("visibilitychange", () => { if (!document.hidden && key(day) > key(today())) { day = today(); loadDraft(); render(); } });

loadDraft();
render();
</script>
</body>
</html>
